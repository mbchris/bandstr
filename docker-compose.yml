services:
  # ── Development ───────────────────────────────
  dev:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "${API_PORT:-3001}:${PORT:-3001}"
      - "${WEB_PORT:-9000}:9000"
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      - NODE_ENV=development
      - DEVMODE=true
      - DATABASE_URL=${DATABASE_URL:-postgresql://bandstr:bandstr_dev@host.docker.internal:5432/bandstr}
    command: sh -c "export COREPACK_ENABLE_DOWNLOAD_PROMPT=0 CI=1; corepack enable && pnpm install && pnpm run dev"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    profiles:
      - dev

  # ── Production (unified) ────────────────────
  prod:
    image: bandstr-prod:${SOURCE_COMMIT:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      tags:
        - bandstr-prod:${SOURCE_COMMIT:-latest}
        - bandstr-prod:latest
      args:
        GIT_REV: ${SOURCE_COMMIT:-unknown}
        SOURCE_COMMIT: ${SOURCE_COMMIT:-unknown}
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      - NODE_ENV=production
      - PORT=3001
      - GIT_REV=${SOURCE_COMMIT:-unknown}
      - SOURCE_COMMIT=${SOURCE_COMMIT:-unknown}
    container_name: ${COOLIFY_CONTAINER_NAME:-bandstr-prod}
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bandstr-prod.rule=Host(`${APP_DOMAIN:-bandstr.trmusic.de}`)"
      - "traefik.http.routers.bandstr-prod.entrypoints=https"
      - "traefik.http.routers.bandstr-prod.tls=true"
      - "traefik.http.routers.bandstr-prod.tls.certresolver=letsencrypt"
      - "traefik.http.services.bandstr-prod.loadbalancer.server.port=80"
      - "traefik.docker.network=coolify"
    networks:
      - app-net
      - proxy-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    profiles:
      - prod

networks:
  app-net:
    name: bandstr-net
  proxy-net:
    external: true
    name: ${DOCKER_NETWORK:-coolify}

volumes:
  node_modules:
