name: bandstr
version: 1.0.0
description: APM project for bandstr
author: Christian Schneider
# Which agent platforms to deploy to.
# Resolution order: --target flag > this field > auto-detect from filesystem.
# Accepted values: agent-skills, antigravity, claude, codex, copilot, cursor, gemini, grok-build, hermes, kiro, opencode, vscode, windsurf
targets:
- codex
- copilot
- gemini
- opencode
- windsurf
dependencies:
  apm:
  - git: https://github.com/prj120/ai-setup
    path: packages/api    # Choose packages/kotlin, packages/vue, packages/csharp, or packages
    ref: main           # Pin to tag or branch
  - git: https://github.com/prj120/ai-setup
    path: packages/web    # Choose packages/kotlin, packages/vue, packages/csharp, or packages
    ref: main           # Pin to tag or branch
  - git: https://github.com/prj120/ai-setup
    path: packages    # Choose packages/kotlin, packages/vue, packages/csharp, or packages
    ref: main           # Pin to tag or branch
  - git: https://github.com/prj120/ai-setup
    path: packages/shared    # Choose packages/kotlin, packages/vue, packages/csharp, or packages
    ref: main           # Pin to tag or branch
  mcp:
includes: auto
scripts: {}
