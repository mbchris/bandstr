name: Deploy iOS App (Apple App Store / TestFlight)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_test_deploy_ios:
    name: Build, Sign & Deploy to TestFlight
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute Build Metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="$(git rev-parse --short=8 HEAD)"
          echo "commit_short=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "SOURCE_COMMIT=$SHORT_SHA" >> "$GITHUB_ENV"
          echo "GIT_REV=$SHORT_SHA" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm via Corepack
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
          pnpm install --frozen-lockfile

      - name: Validate Apple Signing Secrets
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${{ secrets.APPLE_DISTRIBUTION_CERT_BASE64 }}" ]]; then
            echo "::error::Missing secret APPLE_DISTRIBUTION_CERT_BASE64"
            exit 1
          fi
          if [[ -z "${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}" ]]; then
            echo "::error::Missing secret APPLE_PROVISIONING_PROFILE_BASE64"
            exit 1
          fi
          if [[ -z "${{ secrets.APPSTORE_CONNECT_API_KEY_ID }}" ]]; then
            echo "::error::Missing secret APPSTORE_CONNECT_API_KEY_ID"
            exit 1
          fi
          if [[ -z "${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}" ]]; then
            echo "::error::Missing secret APPSTORE_CONNECT_ISSUER_ID"
            exit 1
          fi
          echo "All required Apple credentials present."

      - name: Setup Ephemeral macOS Keychain and Install Certificate
        shell: bash
        env:
          CERT_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERT_BASE64 }}
          CERT_PASS: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          # Create temporary keychain
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import .p12 certificate
          CERT_FILE="$RUNNER_TEMP/cert.p12"
          echo "$CERT_BASE64" | base64 --decode > "$CERT_FILE"
          security import "$CERT_FILE" -P "${CERT_PASS:-}" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          # Install Provisioning Profile
          PP_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PP_DIR"
          echo "$PROFILE_BASE64" | base64 --decode > "$PP_DIR/AppStore.mobileprovision"
          echo "Provisioning profile installed to $PP_DIR"

      - name: Build & Export Signed iOS App (IPA)
        shell: bash
        env:
          SOURCE_COMMIT: ${{ env.SOURCE_COMMIT }}
          GIT_REV: ${{ env.GIT_REV }}
          APPLE_BUNDLE_ID: ${{ vars.APPLE_BUNDLE_ID || 'org.capacitor.bandstr' }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID || vars.APNS_TEAM_ID }}
        run: |
          set -euo pipefail
          ./scripts/build-ios.sh production

      - name: Locate Exported IPA
        id: ipa
        shell: bash
        run: |
          set -euo pipefail
          IPA_FILE="$(find packages/web/src-capacitor/ios/App/build/export -name '*.ipa' | head -n 1 || true)"
          if [[ -z "$IPA_FILE" || ! -f "$IPA_FILE" ]]; then
            echo "::error::Exported IPA file not found."
            exit 1
          fi
          echo "Found IPA: $IPA_FILE"
          echo "ipa_path=$IPA_FILE" >> "$GITHUB_OUTPUT"

      - name: Upload to Apple App Store / TestFlight
        shell: bash
        env:
          APPSTORE_CONNECT_API_KEY_ID: ${{ secrets.APPSTORE_CONNECT_API_KEY_ID }}
          APPSTORE_CONNECT_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}
          APPSTORE_CONNECT_API_KEY_BASE64: ${{ secrets.APPSTORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          ./scripts/upload-ios-appstore.sh "${{ steps.ipa.outputs.ipa_path }}"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bandstr-ios-${{ steps.meta.outputs.commit_short }}.ipa
          path: ${{ steps.ipa.outputs.ipa_path }}
          retention-days: 14

      - name: Clean Up Keychain
        if: always()
        shell: bash
        run: |
          if [[ -n "${KEYCHAIN_PATH:-}" && -f "$KEYCHAIN_PATH" ]]; then
            security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          fi
