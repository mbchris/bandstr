name: Deploy Prod

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy_prod:
    name: Trigger Coolify Deploy
    runs-on: self-hosted
    env:
      COOLIFY_DEPLOY_URL: ${{ vars.COOLIFY_DEPLOY_URL }}
      COOLIFY_AUTH_TOKEN: ${{ secrets.COOLIFY_AUTH_TOKEN }}
    steps:
      - name: Validate Required Environment Variables
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${COOLIFY_DEPLOY_URL:-}" ]]; then
            echo "Missing vars.COOLIFY_DEPLOY_URL"
            exit 1
          fi
          if [[ -z "${COOLIFY_AUTH_TOKEN:-}" ]]; then
            echo "Missing secrets.COOLIFY_AUTH_TOKEN"
            exit 1
          fi

      - name: Call Coolify Deploy Endpoint
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error \
            -H "authorization: ${COOLIFY_AUTH_TOKEN}" \
            "${COOLIFY_DEPLOY_URL}"
          echo "Coolify deploy trigger requested."
